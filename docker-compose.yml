services:
  postgres:
    image: postgres:16-alpine
    container_name: bellaitalia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bellaitalia
    ports:
      # Host 5433 -> container 5432, para no chocar con otro Postgres local
      # (ej. el de Akoch-inmobiliaria) que suele usar el 5432 por defecto.
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
